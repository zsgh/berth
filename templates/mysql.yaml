# 长驻服务模板：mysql
# ⚠️ 注意：需要先构建 /opt/berth/rootfs-mysql（chroot 里装 mysql-server-8.0），
# 目前环境只验证了 redis；此模板作为结构示例保留。
name: mysql
image_rootfs: /opt/berth/rootfs-mysql
command: ["/usr/sbin/mysqld"]
args:
  - "--port={port}"
  - "--bind-address=0.0.0.0"
  - "--datadir=/var/lib/mysql"
  - "--user=root"
env:
  MYSQL_ROOT_PASSWORD: "sandbox"
ports:
  - internal: 3306
    external_range: [13306, 13406]
volumes:
  - internal: /var/lib/mysql
    persist: true
healthcheck:
  type: tcp
  port: 3306
  timeout: 60
  interval: 0.5
resources:
  memory_mb: 1024
  cpu_percent: 100
