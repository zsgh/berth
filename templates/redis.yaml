# 长驻服务模板：redis
# 镜像：sudo scripts/setup_rootfs.sh --with-redis（镜像名 redis）
name: redis
image: redis                              # 镜像名（images.yaml / 自动发现 rootfs-*）
command: ["/usr/bin/redis-server"]
# {port} 会被替换成分配到的宿主端口（host 网络模式下直接监听宿主端口）
args:
  - "--port"
  - "{port}"
  - "--bind"
  - "0.0.0.0"
  - "--protected-mode"
  - "no"
  - "--dir"
  - "/var/lib/redis"
  - "--appendonly"
  - "yes"
  - "--daemonize"
  - "no"
env: {}
ports:
  - internal: 6379
    external_range: [16379, 16479]
volumes:
  - internal: /var/lib/redis
    persist: true
healthcheck:
  type: tcp
  port: 6379
  timeout: 20
  interval: 0.3
resources:
  memory_mb: 512
  cpu_percent: 100
